<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-body: 'Space Grotesk', 'Founders Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

    --ab-night: #1e1e1e;
    --ab-day: #f9f9f9;
    --ab-surface-low: #f4f4f4;
    --ab-surface-container: #efefef;
    --ab-yellow: #fde000;
    --ab-cyan: #01fdfd;
    --ab-magenta: #fd02fd;

    --bg: var(--ab-day);
    --surface: var(--ab-surface-low);
    --surface2: var(--ab-surface-container);
    --surface-elevated: #ffffff;
    --border: rgba(30, 30, 30, 0.1);
    --border-bright: rgba(30, 30, 30, 0.22);
    --text: var(--ab-night);
    --text-dim: #707070;
    --text-subtle: #a8a8a8;
    --accent: var(--ab-night);
    --accent-ink: rgba(30, 30, 30, 0.08);
    --chromie: linear-gradient(90deg, #03fd00 0%, #01fdfd 18%, #1500fc 37%, #fd02fd 56%, #fd0001 77%, #fde000 100%);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--ab-night);
      --surface: #242424;
      --surface2: #2c2c2c;
      --surface-elevated: #303030;
      --border: rgba(249, 249, 249, 0.1);
      --border-bright: rgba(249, 249, 249, 0.22);
      --text: var(--ab-day);
      --text-dim: #a8a8a8;
      --text-subtle: #707070;
      --accent: var(--ab-day);
      --accent-ink: rgba(249, 249, 249, 0.08);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "ss02";
  }

  .deck {
    height: 100dvh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .slide {
    height: 100dvh;
    scroll-snap-align: start;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: clamp(48px, 7vh, 96px) clamp(48px, 10vw, 140px);
    isolation: isolate;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .slide.visible { opacity: 1; transform: none; }

  .slide .reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .slide.visible .reveal { opacity: 1; transform: none; }
  .slide.visible .reveal:nth-child(1) { transition-delay: 0.1s; }
  .slide.visible .reveal:nth-child(2) { transition-delay: 0.2s; }
  .slide.visible .reveal:nth-child(3) { transition-delay: 0.3s; }
  .slide.visible .reveal:nth-child(4) { transition-delay: 0.4s; }
  .slide.visible .reveal:nth-child(5) { transition-delay: 0.5s; }
  .slide.visible .reveal:nth-child(6) { transition-delay: 0.6s; }
  .slide.visible .reveal:nth-child(7) { transition-delay: 0.7s; }
  .slide.visible .reveal:nth-child(8) { transition-delay: 0.75s; }

  @media (prefers-reduced-motion: reduce) {
    .slide, .slide .reveal {
      opacity: 1 !important; transform: none !important; transition: none !important;
    }
  }

  .deck-progress {
    position: fixed; top: 0; left: 0; height: 3px;
    background: var(--chromie);
    background-size: 300% 100%;
    animation: chromie-shift 12s linear infinite;
    z-index: 100; transition: width 0.3s ease; pointer-events: none;
  }

  @keyframes chromie-shift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .deck-dots {
    position: fixed; right: clamp(16px, 2vw, 28px); top: 50%;
    transform: translateY(-50%); display: flex; flex-direction: column;
    gap: 8px; z-index: 100; padding: 10px 8px;
    background: color-mix(in srgb, var(--bg) 70%, transparent 30%);
    border-radius: 20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
  }

  .deck-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim); opacity: 0.35; border: none; padding: 0;
    cursor: pointer; transition: all 0.2s ease;
  }
  .deck-dot:hover { opacity: 0.7; }
  .deck-dot.active { opacity: 1; transform: scale(1.6); background: var(--accent); }

  .deck-counter {
    position: fixed; bottom: clamp(16px, 2vh, 28px); right: clamp(16px, 2vw, 28px);
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
    z-index: 100; font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
  }

  .deck-hints {
    position: fixed; bottom: clamp(16px, 2vh, 28px); left: 50%;
    transform: translateX(-50%); font-family: var(--font-mono);
    font-size: 11px; color: var(--text-dim); opacity: 0.5; z-index: 100;
    transition: opacity 0.5s ease; white-space: nowrap;
    letter-spacing: 0.08em;
  }
  .deck-hints.faded { opacity: 0; pointer-events: none; }

  .display {
    font-size: clamp(52px, 8.5vw, 112px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 0.98;
    text-wrap: balance;
  }
  .heading {
    font-size: clamp(32px, 4.8vw, 56px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-wrap: balance;
  }
  .body {
    font-size: clamp(16px, 1.55vw, 21px);
    line-height: 1.5;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .body-dim {
    font-size: clamp(16px, 1.55vw, 21px);
    line-height: 1.5;
    color: var(--text-dim);
    letter-spacing: -0.005em;
  }
  .label {
    font-family: var(--font-mono);
    font-size: clamp(10px, 0.9vw, 12px);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dim);
  }

  .chromie-bar {
    display: inline-block;
    width: 96px; height: 4px;
    background: var(--chromie);
    background-size: 200% 100%;
    animation: chromie-shift 8s linear infinite;
    margin-bottom: 24px;
    border-radius: 2px;
  }
  .divider-chromie {
    width: 180px; height: 6px;
    background: var(--chromie);
    background-size: 200% 100%;
    animation: chromie-shift 8s linear infinite;
    margin-top: 40px;
    border-radius: 3px;
  }

  .hl {
    background: var(--chromie);
    background-size: 200% 100%;
    animation: chromie-shift 10s linear infinite;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 500;
  }
  @media (prefers-reduced-motion: reduce) {
    .chromie-bar, .divider-chromie, .hl, .deck-progress { animation: none !important; }
  }

  .slide--centered { justify-content: center; align-items: flex-start; }
  .slide--centered-middle { justify-content: center; align-items: center; text-align: center; }

  .title-meta {
    display: flex; gap: 20px; align-items: center;
    margin-bottom: 40px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-dim); letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .title-meta .dot { width: 5px; height: 5px; background: var(--text); border-radius: 50%; }

  .corner-mark {
    position: absolute;
    top: clamp(32px, 5vh, 56px); left: clamp(48px, 10vw, 140px);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .corner-mark.br { top: auto; bottom: clamp(32px, 5vh, 56px); left: auto; right: clamp(48px, 10vw, 140px); }

  .divider-num {
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.1vw, 14px);
    color: var(--text-dim);
    letter-spacing: 0.22em;
    margin-bottom: 32px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .divider-text {
    font-size: clamp(88px, 15vw, 220px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.88;
    color: var(--text);
  }
  .divider-desc {
    margin-top: 32px;
    font-size: clamp(16px, 1.7vw, 22px);
    color: var(--text-dim);
    max-width: 640px;
    line-height: 1.45;
    letter-spacing: -0.005em;
  }

  .agenda-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(16px, 2vw, 28px);
    margin-top: 56px;
    width: 100%;
  }
  .agenda-item {
    padding: clamp(28px, 3vw, 44px);
    border: 1px solid var(--border);
    background: var(--surface-elevated);
    position: relative;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .agenda-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--chromie);
    background-size: 200% 100%;
    animation: chromie-shift 10s linear infinite;
  }
  .agenda-item .num {
    font-family: var(--font-mono);
    font-size: clamp(11px, 1vw, 13px);
    color: var(--text-dim);
    letter-spacing: 0.18em;
    font-weight: 500;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .agenda-item .name {
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    line-height: 1.05;
  }
  .agenda-item .desc {
    font-size: clamp(13px, 1.15vw, 16px);
    color: var(--text-dim);
    line-height: 1.5;
    letter-spacing: -0.005em;
  }

  .content-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.8vw, 22px);
    margin-top: 32px;
  }
  .content-list li {
    font-size: clamp(16px, 1.65vw, 22px);
    line-height: 1.4;
    padding-left: 36px;
    position: relative;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .content-list li::before {
    content: '';
    position: absolute;
    left: 0; top: 0.6em;
    width: 20px; height: 2px;
    background: var(--text);
  }
  .content-list li strong {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .content-list li span.dim {
    color: var(--text-dim);
    font-weight: 400;
  }

  .split-layout {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: clamp(48px, 7vw, 96px);
    align-items: start;
    width: 100%;
  }
  .split-aside .label { margin-bottom: 16px; display: block; }

  .bucket-table {
    width: 100%;
    margin-top: 32px;
    border-collapse: collapse;
  }
  .bucket-table th, .bucket-table td {
    text-align: left;
    padding: clamp(16px, 1.8vw, 22px) clamp(16px, 2vw, 24px);
    border-bottom: 1px solid var(--border);
    font-size: clamp(14px, 1.4vw, 19px);
    letter-spacing: -0.005em;
  }
  .bucket-table th {
    font-family: var(--font-mono);
    font-size: clamp(10px, 0.9vw, 12px);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    border-bottom: 2px solid var(--text);
    padding-bottom: 16px;
  }
  .bucket-table td:first-child {
    font-weight: 500;
    color: var(--text);
  }
  .bucket-table td:last-child {
    color: var(--text-dim);
  }
  .bucket-table td .bold-hl {
    color: var(--text);
    font-weight: 600;
    font-family: var(--font-mono);
    font-size: 0.88em;
    padding: 2px 6px;
    background: var(--accent-ink);
    border-radius: 3px;
  }

  .goal-callout {
    margin-top: 36px;
    padding: clamp(32px, 4vw, 48px) clamp(28px, 3.2vw, 40px);
    background: var(--ab-night);
    color: var(--ab-day);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .goal-callout::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: var(--chromie);
    background-size: 200% 100%;
    animation: chromie-shift 8s linear infinite;
  }
  .goal-callout .goal-num {
    font-size: clamp(44px, 6.5vw, 88px);
    font-weight: 500;
    color: var(--ab-day);
    letter-spacing: -0.04em;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
  }
  .goal-callout .goal-label {
    font-size: clamp(15px, 1.5vw, 21px);
    color: var(--ab-day);
    font-weight: 400;
    line-height: 1.35;
    letter-spacing: -0.005em;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--border-bright);
    font-family: var(--font-mono);
    font-size: clamp(10px, 0.95vw, 12px);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text);
    margin-right: 8px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .pill.hot {
    background: var(--ab-night);
    color: var(--ab-day);
    border-color: var(--ab-night);
  }
  @media (prefers-color-scheme: dark) {
    .pill.hot {
      background: var(--ab-day);
      color: var(--ab-night);
      border-color: var(--ab-day);
    }
  }
  .pill .pdot {
    width: 6px; height: 6px;
    background: currentColor;
    border-radius: 50%;
  }

  @page {
    size: landscape;
    margin: 0;
  }

  @media print {
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1a1a1a;
      --surface-elevated: #1f1f1f;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.18);
      --text: #f0f0f0;
      --text-dim: #888888;
      --text-subtle: #555555;
      --accent: #f0f0f0;
      --accent-ink: rgba(249, 249, 249, 0.08);
    }
    .goal-callout {
      background: var(--ab-night) !important;
      color: var(--ab-day) !important;
    }
    .pill.hot {
      background: var(--ab-day) !important;
      color: var(--ab-night) !important;
      border-color: var(--ab-day) !important;
    }
    .deck {
      height: auto;
      overflow: visible;
      scroll-snap-type: none;
    }
    .slide {
      height: 100vh;
      page-break-after: always;
      break-after: page;
      opacity: 1 !important;
      transform: none !important;
    }
    .slide .reveal {
      opacity: 1 !important;
      transform: none !important;
    }
    .deck-progress, .deck-dots, .deck-counter, .deck-hints {
      display: none !important;
    }
    .chromie-bar, .divider-chromie {
      background: linear-gradient(90deg, #03fd00 0%, #01fdfd 18%, #1500fc 37%, #fd02fd 56%, #fd0001 77%, #fde000 100%) !important;
      animation: none !important;
    }
    .hl {
      background: none !important;
      -webkit-background-clip: unset !important;
      background-clip: unset !important;
      -webkit-text-fill-color: #01fdfd !important;
      color: #01fdfd !important;
      animation: none !important;
    }
  }

  @media (max-width: 820px) {
    .agenda-grid, .split-layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
  }
</style>
</head>

<div class="deck">

<!-- SLIDES -->

</div>

<script>
class SlideEngine {
  constructor() {
    this.deck = document.querySelector('.deck');
    this.slides = [...document.querySelectorAll('.slide')];
    this.current = 0;
    this.total = this.slides.length;
    this.buildChrome();
    this.bindEvents();
    this.observe();
    this.update();
  }

  buildChrome() {
    var bar = document.createElement('div');
    bar.className = 'deck-progress';
    document.body.appendChild(bar);
    this.bar = bar;

    var dots = document.createElement('div');
    dots.className = 'deck-dots';
    var self = this;
    this.slides.forEach(function(_, i) {
      var d = document.createElement('button');
      d.className = 'deck-dot';
      d.title = 'Slide ' + (i + 1);
      d.onclick = function() { self.goTo(i); };
      dots.appendChild(d);
    });
    document.body.appendChild(dots);
    this.dots = [].slice.call(dots.children);

    var ctr = document.createElement('div');
    ctr.className = 'deck-counter';
    document.body.appendChild(ctr);
    this.counter = ctr;

    var hints = document.createElement('div');
    hints.className = 'deck-hints';
    hints.textContent = '\u2190 \u2192 or scroll to navigate';
    document.body.appendChild(hints);
    this.hints = hints;
    this.hintTimer = setTimeout(function() {
      hints.classList.add('faded');
    }, 4000);
  }

  bindEvents() {
    var self = this;
    document.addEventListener('keydown', function(e) {
      if (e.target.closest('input, textarea, [contenteditable]')) return;
      if (['ArrowDown', 'ArrowRight', ' ', 'PageDown'].includes(e.key)) {
        e.preventDefault(); self.next();
      } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) {
        e.preventDefault(); self.prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); self.goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); self.goTo(self.total - 1);
      }
      self.fadeHints();
    });

    var touchY;
    this.deck.addEventListener('touchstart', function(e) {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    this.deck.addEventListener('touchend', function(e) {
      var dy = touchY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 50) { dy > 0 ? self.next() : self.prev(); }
    });
  }

  observe() {
    var self = this;
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          self.current = self.slides.indexOf(entry.target);
          self.update();
        }
      });
    }, { threshold: 0.5 });
    this.slides.forEach(function(s) { obs.observe(s); });
  }

  goTo(i) {
    this.slides[Math.max(0, Math.min(i, this.total - 1))]
      .scrollIntoView({ behavior: 'smooth' });
  }

  next() { if (this.current < this.total - 1) this.goTo(this.current + 1); }
  prev() { if (this.current > 0) this.goTo(this.current - 1); }

  update() {
    this.bar.style.width = ((this.current + 1) / this.total * 100) + '%';
    var self = this;
    this.dots.forEach(function(d, i) { d.classList.toggle('active', i === self.current); });
    this.counter.textContent = (this.current + 1) + ' / ' + this.total;
  }

  fadeHints() {
    clearTimeout(this.hintTimer);
    this.hints.classList.add('faded');
  }
}

document.addEventListener('DOMContentLoaded', function() {
  new SlideEngine();
});
</script>
</body>
</html>
